name: ${STACK_ID:-vampyuyu-local}

x-game: &game
  restart: "no"
  stop_grace_period: 75s
  networks: [game]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-paper-env: &paper-env
  EULA: ${EULA:-FALSE}
  TYPE: PAPER
  VERSION: ${MC_VERSION:?Set MC_VERSION explicitly}
  PAPER_BUILD: ${PAPER_BUILD:?Set PAPER_BUILD explicitly}
  UID: ${PUID:-1000}
  GID: ${PGID:-1000}
  ONLINE_MODE: "FALSE"
  ENABLE_RCON: "TRUE"
  RCON_PORT: "25575"
  SERVER_PORT: "25565"
  ENFORCE_SECURE_PROFILE: "FALSE"
  MAX_PLAYERS: ${MAX_PLAYERS:-40}
  VIEW_DISTANCE: ${VIEW_DISTANCE:-8}
  SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-6}
  # Keep region tasks, arena timers and panel operations responsive when empty.
  PAUSE_WHEN_EMPTY_SECONDS: "-1"
  ENABLE_ROLLING_LOGS: "true"
  LOG_TIMESTAMP: "TRUE"
  ARENA_REDIS_HOST: redis
  ARENA_REDIS_PASSWORD_FILE: /run/secrets/arena_redis_password
  ROLE_BRIDGE_URL: http://panel:8083
  # Public base URL clients download the optional menu resource pack from (/pack/<sha1>.zip on the panel).
  MENU_PACK_BASE_URL: ${MENU_PACK_BASE_URL:-${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}}
  MC_CONNECT_ADDRESS: ${MC_CONNECT_ADDRESS:-play.vampyuyu.win}
  # Paper reads the managed forwarding secret from config/paper-global.yml.
  # Explicitly configure this offline with the tools service before boot.
  SKIP_DOWNLOAD_DEFAULTS: "TRUE"

services:
  redis:
    image: redis:8.2.9-alpine@sha256:5f2e6a105b2a8cc721911d5d29aadb032c25fe55b43e829e3d03413753ff47c2
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/bin/sh", "/redis-start.sh"]
    volumes:
      - ${STATE_DIR:-./state}/redis:/data
      - ./infra/redis-start.sh:/redis-start.sh:ro
    secrets: [arena_redis_password]
    networks: [game]
    tmpfs: ["/tmp:mode=1777,size=8m"]
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  panel:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-panel:${IMAGE_TAG:?Set IMAGE_TAG}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      NETWORK_CURRENCY_NAME: ${NETWORK_CURRENCY_NAME:-Shards}
      CONTROLLER_URL: http://controller:8081
      DB_PATH: /state/panel.db
    volumes:
      - ${STATE_DIR:-./state}/panel:/state
    secrets: [controller_token, role_bridge_token]
    networks: [web, control, game]
    depends_on: [controller]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/app/panel", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  controller:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-controller:${IMAGE_TAG:?Set IMAGE_TAG}
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add: ["${DOCKER_GID:?Set DOCKER_GID to the Docker socket group}"]
    environment: {STACK_ID: "${STACK_ID:-vampyuyu-local}"}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STATE_DIR:-./state}/velocity:/servers/velocity:ro
      - ${STATE_DIR:-./state}/lobby:/servers/lobby
      - ${STATE_DIR:-./state}/creative:/servers/creative
      - ${STATE_DIR:-./state}/survival:/servers/survival
    secrets: [controller_token, role_bridge_token, lobby_rcon, creative_rcon, survival_rcon]
    networks: [control, game]
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  velocity:
    <<: *game
    image: ${PROXY_IMAGE:?Set a pinned PROXY_IMAGE}
    entrypoint: ["/bin/sh", "/network-start.sh", "velocity"]
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: ${VELOCITY_VERSION:?Set VELOCITY_VERSION}
      VELOCITY_BUILD_ID: ${VELOCITY_BUILD:?Set VELOCITY_BUILD}
      MEMORY: 512m
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SERVER_PORT: "25565"
    volumes:
      - ${STATE_DIR:-./state}/velocity:/server
      - ./infra/velocity.toml:/config/velocity.toml:ro
      - ./infra/server-icon.png:/config/server-icon.png:ro
      - ./infra/start.sh:/network-start.sh:ro
    ports: ["${MC_BIND:-127.0.0.1}:25565:25565"]
    mem_limit: 1g
    labels:
      win.vampyuyu.stack: ${STACK_ID:-vampyuyu-local}
      win.vampyuyu.server: velocity

  lobby:
    <<: *game
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-lobby:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      <<: *paper-env
      MEMORY: ${LOBBY_MEMORY:-1G}
      MODE: adventure
      RCON_PASSWORD_FILE: /run/secrets/lobby_rcon
      SERVER_ID: lobby
      LEVEL_TYPE: minecraft:flat
      GENERATOR_SETTINGS: '{"biome":"minecraft:plains","layers":[],"structure_overrides":[]}'
      GENERATE_STRUCTURES: "FALSE"
      SPAWN_MONSTERS: "FALSE"
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: "0"
      PVP: "FALSE"
    entrypoint: ["/bin/sh", "/network-start.sh", "paper"]
    volumes:
      - ${STATE_DIR:-./state}/lobby:/data
      - ./infra/start.sh:/network-start.sh:ro
    secrets: [lobby_rcon, role_bridge_token, arena_redis_password]
    mem_limit: ${LOBBY_LIMIT:-2g}
    labels:
      win.vampyuyu.stack: ${STACK_ID:-vampyuyu-local}
      win.vampyuyu.server: lobby

  creative:
    <<: *game
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-server:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      <<: *paper-env
      MEMORY: ${CREATIVE_MEMORY:-6G}
      MODE: creative
      RCON_PASSWORD_FILE: /run/secrets/creative_rcon
      SERVER_ID: creative
    entrypoint: ["/bin/sh", "/network-start.sh", "paper"]
    volumes:
      - ${STATE_DIR:-./state}/creative:/data
      - ./infra/start.sh:/network-start.sh:ro
    secrets: [creative_rcon, role_bridge_token, arena_redis_password]
    mem_limit: ${CREATIVE_LIMIT:-8g}
    labels:
      win.vampyuyu.stack: ${STACK_ID:-vampyuyu-local}
      win.vampyuyu.server: creative

  survival:
    <<: *game
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-server:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      <<: *paper-env
      MEMORY: ${SURVIVAL_MEMORY:-6G}
      MODE: survival
      RCON_PASSWORD_FILE: /run/secrets/survival_rcon
      SERVER_ID: survival
    entrypoint: ["/bin/sh", "/network-start.sh", "paper"]
    volumes:
      - ${STATE_DIR:-./state}/survival:/data
      - ./infra/start.sh:/network-start.sh:ro
    secrets: [survival_rcon, role_bridge_token, arena_redis_password]
    mem_limit: ${SURVIVAL_LIMIT:-8g}
    labels:
      win.vampyuyu.stack: ${STACK_ID:-vampyuyu-local}
      win.vampyuyu.server: survival

  tools:
    profiles: [tools]
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-tools:${IMAGE_TAG:?Set IMAGE_TAG}
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: none
    volumes:
      - ${STATE_DIR:-./state}:/state
      - ${SECRETS_DIR:-./secrets}:/secrets
      - ${ARCHIVES_DIR:-./archives}:/archives:ro

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["443:443"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_DIR:-./secrets/tls}:/run/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    depends_on: [panel]
    restart: unless-stopped

networks:
  game: {}
  web: {}
  control: {internal: true}

secrets:
  arena_redis_password:
    file: ${SECRETS_DIR:-./secrets}/arena_redis_password
  role_bridge_token:
    file: ${SECRETS_DIR:-./secrets}/role_bridge_token
  controller_token:
    file: ${SECRETS_DIR:-./secrets}/controller_token
  lobby_rcon:
    file: ${SECRETS_DIR:-./secrets}/lobby_rcon
  creative_rcon:
    file: ${SECRETS_DIR:-./secrets}/creative_rcon
  survival_rcon:
    file: ${SECRETS_DIR:-./secrets}/survival_rcon

volumes:
  caddy-data: {}
  caddy-config: {}
